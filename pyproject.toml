[build-system]
requires=['setuptools>=45','wheel']
build-backend='setuptools.build_meta'
[project]
name='For_GUI_development'
version='0.0.0'
description='作成用'
authors=[{name='asaihinata'}]
readme='README.md'
requires-python='>=3.14.3'
dependencies=['babel','japanize-matplotlib','matplotlib','numpy','polars','pillow','PyAutoGUI','python-barcode','python-dateutil','qrcode','requests','setuptools','urllib3']
[project.optional-dependencies]
dev=['pytest>=7.0','black>=22.0','flake8>=4.0',]
[tool.isort]
line_length=88
skip=['tests','demo']
skip_glob=['*/demo*.py','*/*demo.py','*/*demo*.py','*/_import.py']
multi_line_output=0
include_trailing_comma=false
force_single_line=false
combine_as_imports=true
force_sort_within_sections=true
[tool.black]
line-length=88
target-version=['py310', 'py311', 'py312','py314'] # 対応するPythonバージョン
include = '\.pyi?$'
exclude = '''
(
  /(
      \.git
    | \.docs
    | \.vscode
    | \.docs
    | \pycachekill.py
    | \tree.py
  )/
)
'''