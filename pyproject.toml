[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "sgg"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "cycler",
    "japanize_matplotlib",
    "matplotlib",
    "numpy",
    "Pillow",
    "python-dateutil",
    "Requests",
    "setuptools",
    "validators",
]
[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"*" = ["*.pyi", "py.typed"]
[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc"]