[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgg"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
"barcode_generator",
"cycler",
"japanize_matplotlib",
"matplotlib",
"numpy",
"Pillow",
"polars",
"python-barcode",
"python_dateutil",
"qrcode",
"Requests",
"scipy",
"ujson",
"validators"
]

[project.optional-dependencies]
dev = [
    "sphinx>=7.0",
    "pytest>=7.0",
]
[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"*" = ["*.pyi", "py.typed"]
"sgg.dev.color" = ["color.csv"]
[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc"]
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 0
include_trailing_comma = false
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true